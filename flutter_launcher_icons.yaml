# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#25255E"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  # The foreground image is already padded to the adaptive-icon safe zone.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/branding/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#25255E"
    theme_color: "#25255E"
